<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container"> 
    <h1>Color Picker</h1>

    <div class="color-picker">
      <input type="color" id="colorInput"> 
      <p>selected color: <span id="colorCode">#fff`fff</span></p>
    </div>

    <div id="colorDisplay" class="color-display"></div>

    <button id="copyBtn">Clip to Clipboard</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
